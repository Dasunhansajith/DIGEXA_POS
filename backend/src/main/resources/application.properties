spring.application.name=nexshop-backend
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexpos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:24103461}

# JPA / Hibernate Configuration (Schema managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
jwt.secret=${JWT_SECRET:NHY3dyF6JUMqRi1KYU5kUmdVa1hwMnM1djh5L0I/RShHK0tiUGVTaFZtWXEzdDZ3OXomRilKQE1jUWZUalc=}

